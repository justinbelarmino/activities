    </main>

    <script>
        var pokemon = JSON.parse(document.getElementById("pokemon-data").textContent);
        var elGrid = document.getElementById("pokemon-grid");

        for (var i = 0; i < pokemon.length; i++) {
            var entry = pokemon[i];
            var skills = "";

            for (var j = 0; j < entry.skills.length; j++) {
                var skill = entry.skills[j];
                var effect = "";

                if (skill.effect) {
                    effect = `<p class="pokemon-skill-effect">${skill.effect}</p>`;
                }

                skills += `
                    <div class="border-top pt-2">
                        <div class="d-flex justify-content-between align-items-baseline gap-2">
                            <h3 class="pokemon-skill-name">${skill.name}</h3>
                            <span class="pokemon-skill-damage">${skill.damage}</span>
                        </div>
                        ${effect}
                    </div>
                `;
            }

            elGrid.innerHTML += `
                <div class="col-12 col-lg-6">
                    <article class="card h-100 border-0 rounded-4 shadow-sm p-3 pokemon-box">
                        <div class="row g-3 align-items-center h-100">
                            <div class="col-4">
                                <img class="img-fluid rounded-3 shadow pokemon-card-image"
                                    src="${entry.image}"
                                    alt="${entry.name} Pokémon card"
                                    loading="lazy">
                            </div>
                            <div class="col-8 min-w-0">
                                <span class="pokemon-number">${entry.number}</span>
                                <h2 class="pokemon-name">${entry.name}</h2>
                                <div class="pokemon-tags d-flex flex-wrap gap-2">
                                    <span class="badge rounded-pill text-bg-light border">${entry.stage}</span>
                                    <span class="badge rounded-pill text-bg-light border">${entry.type}</span>
                                    <span class="badge rounded-pill text-bg-light border">${entry.hp}</span>
                                </div>
                                <div class="d-grid gap-2 mt-3">
                                    ${skills}
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            `;
        }
    </script>
</body>

</html>
