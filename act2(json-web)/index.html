    <meta name="theme-color" content="#f5f4f0">
    <title>Pokémon Card Collection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main class="collection-shell container py-5 py-lg-5">
        <header class="d-flex flex-column flex-sm-row align-items-sm-end justify-content-between gap-3 mb-4 mb-lg-5">
            <div>
                <p class="eyebrow mb-2">Trainer's binder</p>
                <h1 class="page-title mb-2">Pokémon collection</h1>
                <p class="intro-copy mb-0">Eight favorite cards, with their attacks and effects.</p>
            </div>
            <span class="collection-count px-3 py-2">08 cards&nbsp; · &nbsp;My collection</span>
        </header>

        <section id="pokemon-grid" class="row g-3 g-lg-4" aria-label="Pokémon card collection"></section>
    </main>

    <script>
        const pokemon = JSON.parse(document.getElementById("pokemon-data").textContent);
        const grid = document.getElementById("pokemon-grid");

        pokemon.forEach((entry) => {
            const column = document.createElement("div");
            column.className = "col-12 col-lg-6";

            const card = document.createElement("article");
            card.className = "card h-100 border-0 rounded-4 shadow-sm p-3 pokemon-box";

            const cardLayout = document.createElement("div");
            cardLayout.className = "row g-3 align-items-center h-100";

            const image = document.createElement("img");
            image.className = "img-fluid rounded-3 shadow pokemon-card-image";
            image.src = entry.image;
            image.alt = `${entry.name} Pokémon card`;
            image.loading = "lazy";

            const imageColumn = document.createElement("div");
            imageColumn.className = "col-4";
            imageColumn.append(image);

            const details = document.createElement("div");
            details.className = "col-8 min-w-0";

            const number = document.createElement("span");
            number.className = "pokemon-number";
            number.textContent = entry.number;

            const name = document.createElement("h2");
            name.className = "pokemon-name";
            name.textContent = entry.name;

            const tags = document.createElement("div");
            tags.className = "pokemon-tags d-flex flex-wrap gap-2";

            [entry.stage, entry.type, entry.hp].forEach((label) => {
                const badge = document.createElement("span");
                badge.className = "badge rounded-pill text-bg-light border";
                badge.textContent = label;
                tags.append(badge);
            });

            const skills = document.createElement("div");
            skills.className = "d-grid gap-2 mt-3";

            entry.skills.forEach((skill) => {
                const skillRow = document.createElement("div");
                skillRow.className = "border-top pt-2";

                const skillHeading = document.createElement("div");
                skillHeading.className = "d-flex justify-content-between align-items-baseline gap-2";

                const skillName = document.createElement("h3");
                skillName.className = "pokemon-skill-name";
                skillName.textContent = skill.name;

                const skillDamage = document.createElement("span");
                skillDamage.className = "pokemon-skill-damage";
                skillDamage.textContent = skill.damage;
                skillHeading.append(skillName, skillDamage);
                skillRow.append(skillHeading);

                if (skill.effect) {
                    const skillEffect = document.createElement("p");
                    skillEffect.className = "pokemon-skill-effect";
                    skillEffect.textContent = skill.effect;
                    skillRow.append(skillEffect);
                }

                skills.append(skillRow);
            });

            details.append(number, name, tags, skills);
            cardLayout.append(imageColumn, details);
            card.append(cardLayout);
            column.append(card);
            grid.append(column);
        });
    </script>
</body>

</html>
