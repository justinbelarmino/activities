<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .bento-card {
            background: #f3f3f3;
            border: 1px solid #e5e5e5;
            border-radius: 22px;
            color: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            min-height: 110px;
            width: 100%;
        }

        .bento-card--hero {
            height: clamp(180px, 32vw, 280px);
        }

        .bento-card--small {
            height: clamp(100px, 18vw, 130px);
        }

        .bento-card--medium {
            height: clamp(90px, 16vw, 120px);
        }

        @media (max-width: 767.98px) {
            .bento-card--hero,
            .bento-card--small,
            .bento-card--medium {
                height: 140px;
            }
        }
    </style>
</head>

<body class="bg-light">
    <div class="container py-4">
        <div class="row g-3">
            <div class="col-12 col-md-8">
                <div class="bento-card bento-card--hero h-100">
                    Large Item
                </div>
            </div>

            <div class="col-12 col-md-4">
                <div class="row g-3 h-100">
                    <div class="col-12">
                        <div class="bento-card bento-card--small">
                            Small Item 1
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="bento-card bento-card--small">
                            Small Item 2
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <div class="bento-card bento-card--medium">
                            Medium Item 1
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="bento-card bento-card--medium">
                            Medium Item 2
                        </div>
                    </div>
                    <div class="col-12 col-md-4">
                        <div class="bento-card bento-card--medium">
                            Medium Item 3
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
